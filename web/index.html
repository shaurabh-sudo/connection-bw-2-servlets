
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Registration Form</title>
</head>

<body bgcolor="#7fffd4" style="text-align: center;">

<h2>Kindly register to proceed further</h2>

<form method="post" action="./FirstServlet">
    <table align="center">
        <tr>
            <td>User Name:</td>
            <td>
                <input type="text" name="uname" required>
            </td>
        </tr>

        <tr>
            <td>User City:</td>
            <td>
                <input type="text" name="ucity" required>
            </td>
        </tr>

        <tr>
            <td colspan="2" align="center">
                <input type="submit" value="Sign Up">
            </td>
        </tr>
    </table>
</form>

</body>
</html>
